# CrowdSolve Docker Compose - Production Ready

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: crowdsolve-db
    environment:
      POSTGRES_DB: ${DB_NAME:-crowdsolve}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend (Java/Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crowdsolve-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crowdsolve}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AI_SERVICE_URL: http://ai-service:8000
      PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # AI Service (Python/FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: crowdsolve-ai
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8000
    ports:
      - "${AI_PORT:-8000}:8000"
    restart: unless-stopped

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crowdsolve-frontend
    environment:
      REACT_APP_API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: